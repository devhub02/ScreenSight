[project]
name = "screensight"
version = "0.1.0"
description = "Universal 'let the agent see your screen' tool — works as an MCP server (Claude Code, Cursor, Windsurf, Cline, Codex CLI) or a plain CLI (Aider, shell scripts, anything)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HARSHIT TRIPATHI" }]
dependencies = [
    "fastmcp>=2.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
screensight = "screensight.__main__:main"
screensight-mcp = "screensight.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screensight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
